  <script>
    // Audio synthesizer helper using Web Audio API
    let audioCtx = null;
    function playSound(type) {
      const settings = getSettings();
      if (!settings.soundEnabled) return;
      
      const style = settings.soundStyle || 'retro';
      
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        if (style === 'modern') {
          // --- Sci-Fi / Modern Style ---
          if (type === 'roll') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.07);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.07);
            osc.start(now);
            osc.stop(now + 0.07);
          } else if (type === 'success') {
            // Sparkling crystal cascade
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, now); // C6
            osc.frequency.setValueAtTime(1318.51, now + 0.06); // E6
            osc.frequency.setValueAtTime(1567.98, now + 0.12); // G6
            osc.frequency.setValueAtTime(2093.00, now + 0.18); // C7
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            osc.start(now);
            osc.stop(now + 0.55);
          } else if (type === 'reset') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.25);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'warning') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        } else if (style === 'suspense') {
          // --- Classic Suspense / Drumroll Style ---
          if (type === 'roll') {
            // Deep suspense mechanical ticks
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
            osc.start(now);
            osc.stop(now + 0.04);
          } else if (type === 'success') {
            // Heroic Brass Fanfare
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(783.99, now + 0.1); // G5
            osc.frequency.setValueAtTime(1046.50, now + 0.2); // C6
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.setValueAtTime(0.1, now + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
          } else if (type === 'reset') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.35);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else if (type === 'warning') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.setValueAtTime(130, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          }
        } else {
          // --- 8-bit Retro Game Style (Default) ---
          if (type === 'roll') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'success') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(987.77, now); // B5
            osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.setValueAtTime(0.06, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else if (type === 'reset') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === 'warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(110, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        }
      } catch (err) {
        console.warn("Audio playback failed: ", err);
      }
    }

    // Default settings
    const defaultSettings = {
      minFloor: 2,
      maxFloor: 23,
      units: ['A1','A2','A3','A5','A6','A7','A8','A9','A11'],
      parkingCount: 202,
      excludedParkingStr: "",
      soundEnabled: true,
      soundStyle: 'retro'
    };

    // Parser for excluded parking spots
    function parseExcludedParking(str) {
      const excluded = new Set();
      if (!str) return excluded;
      const parts = str.split(',');
      parts.forEach(part => {
        const trimmed = part.trim();
        if (trimmed.includes('-')) {
          const rangeParts = trimmed.split('-');
          if (rangeParts.length === 2) {
            const start = parseInt(rangeParts[0]);
            const end = parseInt(rangeParts[1]);
            if (!isNaN(start) && !isNaN(end) && start <= end) {
              for (let i = start; i <= end; i++) {
                excluded.add(i);
              }
            }
          }
        } else {
          const num = parseInt(trimmed);
          if (!isNaN(num)) {
            excluded.add(num);
          }
        }
      });
      return excluded;
    }

    // Settings retrieval
    function getSettings() {
      const saved = localStorage.getItem('lottery_settings');
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch(e) {
          return defaultSettings;
        }
      }
      return defaultSettings;
    }

    function saveSettings(settings) {
      localStorage.setItem('lottery_settings', JSON.stringify(settings));
    }

    // Generate static pool of households based on settings
    function generateHouseholds(settings) {
      const households = [];
      const minF = parseInt(settings.minFloor);
      const maxF = parseInt(settings.maxFloor);
      for (let f = minF; f <= maxF; f++) {
        settings.units.forEach(u => {
          households.push(`${u}-${f}F`);
        });
      }
      return households;
    }

    // Current Lottery States
    let state = {
      householdPool: [],
      parkingPool: [],
      drawnHouseholds: [], // Stores elements: { household: "A1-2F", parking: 5 }
      lastDrawnHousehold: null,
      awaitingParking: false
    };

    // Load state from localStorage or initialize
    function loadState() {
      const saved = localStorage.getItem('lottery_state_single');
      const settings = getSettings();
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch(e) {
          initializeNewState(settings);
        }
      } else {
        initializeNewState(settings);
      }
    }

    function saveState() {
      localStorage.setItem('lottery_state_single', JSON.stringify(state));
    }

    function initializeNewState(settings) {
      state.householdPool = generateHouseholds(settings);
      
      const totalCount = parseInt(settings.parkingCount);
      const excludedSet = parseExcludedParking(settings.excludedParkingStr);
      const pPool = [];
      for (let i = 1; i <= totalCount; i++) {
        if (!excludedSet.has(i)) {
          pPool.push(i);
        }
      }
      state.parkingPool = pPool;

      state.drawnHouseholds = [];
      state.lastDrawnHousehold = null;
      state.awaitingParking = false;
      saveState();
    }

    // Fisher-Yates Shuffle
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // DOM Elements
    const remainingHouseholds = document.getElementById("remainingHouseholds");
    const remainingParking = document.getElementById("remainingParking");
    const matchedCount = document.getElementById("matchedCount");
    const householdDisplay = document.getElementById("householdDisplay");
    const parkingDisplay = document.getElementById("parkingDisplay");
    const householdHistory = document.getElementById("householdHistory");
    const parkingHistory = document.getElementById("parkingHistory");
    const householdLogCount = document.getElementById("householdLogCount");
    const parkingLogCount = document.getElementById("parkingLogCount");

    // Modal Inputs
    const settingsModal = document.getElementById("settingsModal");
    const minFloorInput = document.getElementById("minFloorInput");
    const maxFloorInput = document.getElementById("maxFloorInput");
    const unitsInput = document.getElementById("unitsInput");
    const parkingCountInput = document.getElementById("parkingCountInput");
    const excludedParkingInput = document.getElementById("excludedParkingInput");
    const soundToggle = document.getElementById("soundToggle");
    const soundStyleSelect = document.getElementById("soundStyleSelect");
    const rollDurationInput = document.getElementById("rollDurationInput");
    const batchIntervalInput = document.getElementById("batchIntervalInput");

    // Render Stats and Histories
    function renderUI() {
      remainingHouseholds.textContent = state.householdPool.length;
      remainingParking.textContent = state.parkingPool.length;
      matchedCount.textContent = state.drawnHouseholds.length;
      
      // Handle Display states
      if (state.lastDrawnHousehold) {
        householdDisplay.textContent = state.lastDrawnHousehold;
        householdDisplay.classList.remove("text-slate-500");
        householdDisplay.classList.add("text-indigo-400");
      } else {
        householdDisplay.textContent = "等待抽選";
        householdDisplay.classList.remove("text-indigo-400");
        householdDisplay.classList.add("text-slate-500");
      }

      if (state.drawnHouseholds.length > 0 && !state.awaitingParking) {
        const lastPair = state.drawnHouseholds[state.drawnHouseholds.length - 1];
        parkingDisplay.textContent = `車位 ${lastPair.parking}`;
        parkingDisplay.classList.remove("text-slate-500");
        parkingDisplay.classList.add("text-emerald-400");
      } else {
        parkingDisplay.textContent = "等待配對";
        parkingDisplay.classList.remove("text-emerald-400");
        parkingDisplay.classList.add("text-slate-500");
      }

      // Render Logs
      householdHistory.innerHTML = "";
      state.drawnHouseholds.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "flex justify-between border-b border-slate-900 py-1.5 hover:bg-slate-900/30 px-2 rounded transition-all";
        li.innerHTML = `<span class="text-slate-500">${index + 1}.</span> <span class="text-indigo-300 font-semibold">${item.household}</span>`;
        householdHistory.appendChild(li);
      });
      // If awaiting, show the current drawing household as next numbered item
      if (state.lastDrawnHousehold) {
        const li = document.createElement("li");
        li.className = "flex justify-between border-b border-slate-900 py-1.5 bg-indigo-950/20 px-2 rounded animate-pulse";
        li.innerHTML = `<span class="text-indigo-400">${state.drawnHouseholds.length + 1}.</span> <span class="text-indigo-400 font-bold">${state.lastDrawnHousehold}</span> <span class="text-xs px-1.5 py-0.5 rounded bg-indigo-900/50 text-indigo-300">配對中</span>`;
        householdHistory.appendChild(li);
      }

      householdLogCount.textContent = `${state.drawnHouseholds.length + (state.lastDrawnHousehold ? 1 : 0)} 戶`;

      // Render pairings
      parkingHistory.innerHTML = "";
      state.drawnHouseholds.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "flex justify-between items-center border-b border-slate-900 py-1.5 hover:bg-slate-900/30 px-2 rounded transition-all";
        li.innerHTML = `
          <div>
            <span class="text-slate-500 text-xs mr-1">#${index + 1}</span>
            <span class="text-indigo-300 font-semibold">${item.household}</span>
          </div>
          <span class="text-slate-500 text-xs">➜</span>
          <span class="text-emerald-400 font-bold">車位 ${item.parking}</span>
        `;
        parkingHistory.appendChild(li);
      });
      parkingLogCount.textContent = `${state.drawnHouseholds.length} 筆`;

      // Scroll logs to bottom
      householdHistory.parentElement.scrollTop = householdHistory.parentElement.scrollHeight;
      parkingHistory.parentElement.scrollTop = parkingHistory.parentElement.scrollHeight;
    }

    // Animation Rolling Effect
    let isRolling = false;
    
    function animateDraw(element, pool, duration, finalValue, onComplete) {
      isRolling = true;
      let elapsed = 0;
      const intervalTime = 50;
      
      const interval = setInterval(() => {
        playSound('roll');
        // Pick a random value from the remaining pool representation for visual display
        if (pool.length > 0) {
          const randomIndex = Math.floor(Math.random() * pool.length);
          const tempVal = pool[randomIndex];
          element.textContent = typeof tempVal === 'number' ? `車位 ${tempVal}` : tempVal;
        } else {
          element.textContent = "抽選中...";
        }
        
        elapsed += intervalTime;
        if (elapsed >= duration) {
          clearInterval(interval);
          element.textContent = typeof finalValue === 'number' ? `車位 ${finalValue}` : finalValue;
          playSound('success');
          isRolling = false;
          onComplete();
        }
      }, intervalTime);
    }

    // Actions
    function drawHousehold() {
      if (isRolling) return;
      if (state.awaitingParking) {
        playSound('warning');
        alert("請先分配目前住戶的車位後，才能再抽下一戶！👀");
        return;
      }
      if (state.householdPool.length === 0) {
        playSound('warning');
        alert("所有住戶已抽選完畢！🎉");
        return;
      }
      
      // Shuffle & Pop
      shuffle(state.householdPool);
      const chosen = state.householdPool.pop();
      
      state.lastDrawnHousehold = chosen;
      state.awaitingParking = true;
      saveState();

      // Trigger rolling visual
      const settings = getSettings();
      const tempPool = generateHouseholds(settings); // full list for better rolling variety
      animateDraw(householdDisplay, tempPool, Math.max(100, parseFloat(settings.rollDuration || 0.8) * 1000), chosen, () => {
        renderUI();
      });
    }

    function drawParking() {
      if (isRolling) return;
      if (!state.lastDrawnHousehold) {
        playSound('warning');
        alert("請先抽住戶再配對車位！");
        return;
      }
      if (state.parkingPool.length === 0) {
        playSound('warning');
        alert("車位已配發完畢！");
        return;
      }
      
      shuffle(state.parkingPool);
      const chosenParking = state.parkingPool.pop();
      
      const lastHousehold = state.lastDrawnHousehold;
      
      // Trigger rolling visual
      const settings = getSettings();
      const totalCount = parseInt(settings.parkingCount);
      const excludedSet = parseExcludedParking(settings.excludedParkingStr);
      const tempParkingPool = [];
      for (let i = 1; i <= totalCount; i++) {
        if (!excludedSet.has(i)) {
          tempParkingPool.push(i);
        }
      }
      
      animateDraw(parkingDisplay, tempParkingPool, Math.max(100, parseFloat(settings.rollDuration || 0.8) * 1000), chosenParking, () => {
        state.drawnHouseholds.push({
          household: lastHousehold,
          parking: chosenParking
        });
        state.lastDrawnHousehold = null;
        state.awaitingParking = false;
        saveState();
        renderUI();
      });
    }

    function resetAll() {
      if (isRolling) return;
      playSound('reset');
      if (!confirm("確定要清除目前所有抽籤紀錄並重新開始嗎？所有歷史資料將會重置！")) return;
      
      const settings = getSettings();
      initializeNewState(settings);
      renderUI();
    }

    // Modal Control
    function populateModal() {
      const settings = getSettings();
      minFloorInput.value = settings.minFloor;
      maxFloorInput.value = settings.maxFloor;
      unitsInput.value = settings.units.join(', ');
      parkingCountInput.value = settings.parkingCount;
      excludedParkingInput.value = settings.excludedParkingStr || "";
      rollDurationInput.value = settings.rollDuration || 0.8;
      batchIntervalInput.value = settings.batchInterval || 1.5;
      soundToggle.checked = settings.soundEnabled;
      soundStyleSelect.value = settings.soundStyle || "retro";
    }

    document.getElementById("openSettingsBtn").addEventListener("click", () => {
      populateModal();
      settingsModal.classList.remove("hidden");
    });

    function closeSettings() {
      settingsModal.classList.add("hidden");
    }

    document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);
    document.getElementById("closeModalBtn").addEventListener("click", closeSettings);

    document.getElementById("resetDefaultsBtn").addEventListener("click", () => {
      if(confirm("確定要恢復原廠預設值嗎？這將會更新設定。")) {
        saveSettings(defaultSettings);
        populateModal();
      }
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const minF = parseInt(minFloorInput.value);
      const maxF = parseInt(maxFloorInput.value);
      const parkingC = parseInt(parkingCountInput.value);
      const unitsArr = unitsInput.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
      
      if (isNaN(minF) || isNaN(maxF) || minF < 1 || maxF < minF) {
        alert("樓層設定不正確！起始樓層必須小於或等於最高樓層。");
        return;
      }
      if (unitsArr.length === 0) {
        alert("必須輸入至少一個戶別代碼！");
        return;
      }
      if (isNaN(parkingC) || parkingC < 1) {
        alert("總車位數量必須大於 0！");
        return;
      }

      const rollD = parseFloat(rollDurationInput.value);
      const batchI = parseFloat(batchIntervalInput.value);
      
      if (isNaN(rollD) || rollD < 0.1 || rollD > 10) {
        alert("單步動畫時間必須介於 0.1 至 10 秒之間！");
        return;
      }
      if (isNaN(batchI) || batchI < 0.1 || batchI > 10) {
        alert("批次自動間隔時間必須介於 0.1 至 10 秒之間！");
        return;
      }

      const newSettings = {
        minFloor: minF,
        maxFloor: maxF,
        units: unitsArr,
        parkingCount: parkingC,
        excludedParkingStr: excludedParkingInput.value.trim(),
        rollDuration: rollD,
        batchInterval: batchI,
        soundEnabled: soundToggle.checked,
        soundStyle: soundStyleSelect.value
      };

      saveSettings(newSettings);
      
      // Ask to reset state with new configuration
      if (confirm("儲存設定成功！是否要依照新設定重置當前的抽籤狀態？\n(注意：不重置可能導致剩餘名單數據與新設定不一致！)")) {
        initializeNewState(newSettings);
      } else {
        // Just save setting and trigger UI update
        saveState();
      }
      
      closeSettings();
      renderUI();
    });

    // Export result to Excel (CSV format with UTF-8 BOM)
    function exportToExcel() {
      if (state.drawnHouseholds.length === 0) {
        playSound('warning');
        alert("目前沒有任何已產生的抽籤結果可以匯出！");
        return;
      }
      
      let csvContent = "\ufeff"; // UTF-8 BOM for Excel Chinese characters
      csvContent += "抽籤順序,住戶戶號,獲配車位\n";
      state.drawnHouseholds.forEach((item, index) => {
        csvContent += `${index + 1},${item.household},車位 ${item.parking}\n`;
      });
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      const now = new Date();
      const dateStr = now.getFullYear() + 
                      String(now.getMonth() + 1).padStart(2, '0') + 
                      String(now.getDate()).padStart(2, '0') + "_" + 
                      String(now.getHours()).padStart(2, '0') + 
                      String(now.getMinutes()).padStart(2, '0');
                      
      link.setAttribute("href", url);
      link.setAttribute("download", `機車車位抽籤結果_單步_${dateStr}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      playSound('success');
    }

    // Event Listeners for Operations
    document.getElementById("drawHouseholdBtn").addEventListener("click", drawHousehold);
    document.getElementById("drawParkingBtn").addEventListener("click", drawParking);
    document.getElementById("resetAllBtn").addEventListener("click", resetAll);
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);

    // Initial Load
    loadState();
    renderUI();
  </script>
</body>
</html>
