<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔍 機車車位抽籤結果查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-indigo-500 to-purple-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
          <span class="text-2xl">🏍️</span>
        </div>
        <div>
          <h1 class="text-xl font-bold font-outfit tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">機車車位抽籤系統</h1>
          <p class="text-xs text-slate-400">專為社區大樓設計的公平車位抽選工具</p>
        </div>
      </div>
      
      <!-- Nav Tabs -->
      <div class="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-800/60 max-w-full overflow-x-auto">
        <a href="index.html" class="px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-slate-200 shrink-0">
          🔄 單步抽籤
        </a>
        <a href="batch.html" class="px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-slate-200 shrink-0">
          ⚡ 批次抽籤
        </a>
        <a href="search.html" class="px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/10 shrink-0">
          🔍 查詢車位
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col gap-6">

    <!-- Title and Description -->
    <div class="text-center py-6">
      <h2 class="text-3xl font-extrabold font-outfit text-slate-100 tracking-tight">🔍 車位配對結果查詢</h2>
      <p class="text-slate-400 text-sm mt-2">請匯入已抽籤完成的 Excel (CSV) 檔案，或直接載入本機抽籤快照進行查詢</p>
    </div>

    <!-- Data Import Section -->
    <div class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 shadow-xl backdrop-blur-md relative overflow-hidden flex flex-col gap-4">
      
      <!-- Ambient Glow -->
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <h3 class="font-bold text-slate-200 flex items-center gap-2">
            <span>📂</span> 數據資料來源
          </h3>
          <p class="text-xs text-slate-500 mt-1" id="dataStatusText">目前未載入任何數據</p>
        </div>
        
        <!-- Local Storage Quick Load Button -->
        <button id="loadLocalBtn" class="px-4 py-2 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 rounded-xl text-xs font-semibold transition-all">
          ⚡ 載入本機抽籤結果
        </button>
      </div>

      <!-- Drag & Drop Zone -->
      <div id="dropzone" class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 bg-slate-950/40 rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer transition-all">
        <input type="file" id="csvFileInput" accept=".csv" class="hidden">
        <span class="text-4xl mb-3">📄</span>
        <span class="text-sm font-semibold text-slate-300">拖曳已匯出的 CSV 檔案至此，或點擊選取檔案</span>
        <span class="text-xs text-slate-550 mt-1">只支援系統匯出的 UTF-8 CSV 格式檔案</span>
      </div>

    </div>

    <!-- Search Section (Hidden until data is loaded) -->
    <div id="searchCard" class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md flex flex-col gap-6 relative overflow-hidden hidden">
      
      <!-- Ambient Glow -->
      <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>

      <h3 class="text-lg font-bold font-outfit text-slate-200 border-b border-slate-800 pb-3 flex items-center gap-2">
        <span>🔎</span> 查詢系統
      </h3>

      <!-- Input box -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <span class="text-slate-500">🔍</span>
        </div>
        <input type="text" id="searchInput" placeholder="輸入戶號或車位編號進行查詢... (例如：A1-3F 或 5)" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-2xl py-4 pl-12 pr-4 text-slate-200 placeholder-slate-650 font-mono focus:outline-none text-lg transition-all">
      </div>

      <!-- Single Match Big Result Visualizer -->
      <div id="exactMatchContainer" class="hidden animate-fade-in">
        <div class="bg-gradient-to-r from-indigo-950/20 to-emerald-950/20 border border-indigo-500/30 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-6">
          <div class="flex flex-col items-center md:items-start text-center md:text-left gap-1">
            <span class="text-xs font-semibold text-indigo-400 uppercase tracking-widest">查詢住戶</span>
            <span id="matchHousehold" class="text-3xl font-extrabold font-outfit text-slate-100">--</span>
            <span id="matchAddress" class="text-xs text-slate-400 font-medium"></span>
          </div>
          <div class="text-indigo-400 text-2xl rotate-90 md:rotate-0">➜</div>
          <div class="flex flex-col items-center md:items-end text-center md:text-right gap-1">
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-widest">配對車位結果</span>
            <span id="matchParking" class="text-3xl font-extrabold font-outfit text-emerald-400">--</span>
          </div>
        </div>
      </div>

      <!-- List Results Container -->
      <div class="flex flex-col gap-3">
        <h4 id="listHeading" class="text-xs font-semibold text-slate-450 uppercase tracking-wider hidden">查詢到的相符結果</h4>
        <div id="searchResultsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[300px] overflow-y-auto pr-1">
          <!-- Dynamic cards -->
        </div>
      </div>

    </div>

  </main>

  <footer class="mt-auto border-t border-slate-900 bg-slate-950/30 py-6 text-center text-xs text-slate-600">
    <div>機車車位抽籤系統 © 2026. Made with Jason for 鑫悅</div>
  </footer>

  <script>
    // Audio synthesizer helper using Web Audio API
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'warning') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (err) {
        console.warn("Audio playback failed: ", err);
      }
    }

    // Parsed Lottery Data Array
    let loadedData = []; // array of { household, parking }

    // Address parser mapping for households
    function getHouseholdAddress(household) {
      if (!household) return "";

      // Storefront mapping
      const storeMap = {
        'S1': '1樓店面 S1',
        'S2': '1樓店面 S2',
        'S3': '1樓店面 S3',
        'S5': '1樓店面 S5'
      };
      if (storeMap[household.toUpperCase()]) {
        return storeMap[household.toUpperCase()];
      }

      const storeMatch = household.match(/^(S\d+)(-1F)?$/i);
      if (storeMatch) {
        return `1樓店面 ${storeMatch[1].toUpperCase()}`;
      }

      const match = household.match(/^([A-Za-z0-9]+)-(\d+)F$/);
      if (!match) return "";
      
      const unit = match[1];
      const floor = match[2];
      
      const unitMap = {
        'A1': '426號之1',
        'A2': '428號之1',
        'A3': '428號之2',
        'A5': '428號之3',
        'A6': '428號之5',
        'A7': '428號之6',
        'A8': '426號之5',
        'A9': '426號之3',
        'A11': '426號之2'
      };
      
      const baseAddr = unitMap[unit];
      if (!baseAddr) return "";
      
      const addrMatch = baseAddr.match(/^(\d+號)(之\d+)$/);
      if (!addrMatch) return `${baseAddr} (${floor}F)`;
      
      return `${addrMatch[1]}${floor}樓${addrMatch[2]}`;
    }

    // DOM elements
    const dropzone = document.getElementById("dropzone");
    const csvFileInput = document.getElementById("csvFileInput");
    const dataStatusText = document.getElementById("dataStatusText");
    const loadLocalBtn = document.getElementById("loadLocalBtn");
    const searchCard = document.getElementById("searchCard");
    const searchInput = document.getElementById("searchInput");
    const exactMatchContainer = document.getElementById("exactMatchContainer");
    const matchHousehold = document.getElementById("matchHousehold");
    const matchAddress = document.getElementById("matchAddress");
    const matchParking = document.getElementById("matchParking");
    const listHeading = document.getElementById("listHeading");
    const searchResultsList = document.getElementById("searchResultsList");

    // CSV Parser
    function parseCSV(text) {
      const lines = text.split('\n');
      const results = [];
      
      lines.forEach(line => {
        const parts = line.trim().split(',');
        if (parts.length >= 3) {
          const indexVal = parts[0].trim();
          const household = parts[1].trim();
          const parking = parts[2].trim();
          
          // Skip header
          if (household === "住戶戶號" || household === "household" || household.toLowerCase() === "household_number") {
            return;
          }
          
          if (household && parking) {
            results.push({
              household: household,
              parking: parking
            });
          }
        }
      });
      return results;
    }

    // Handle Data Load Success
    function onDataLoaded(data, sourceName) {
      loadedData = data;
      dataStatusText.textContent = `已成功從 ${sourceName} 載入 ${data.length} 筆配對資料！`;
      dataStatusText.className = "text-xs text-emerald-400 font-bold";
      
      // Show Search card
      searchCard.classList.remove("hidden");
      
      // Reset search
      searchInput.value = "";
      doSearch("");
      
      playSound('success');
    }

    // Load Local Storage snapshot
    function loadLocalData() {
      // Check both single and batch states
      const singleSaved = localStorage.getItem('lottery_state_single');
      const batchSaved = localStorage.getItem('lottery_state_batch');
      let combinedData = [];

      // Parse single state
      if (singleSaved) {
        try {
          const parsed = JSON.parse(singleSaved);
          if (parsed && parsed.drawnHouseholds && parsed.drawnHouseholds.length > 0) {
            parsed.drawnHouseholds.forEach(item => {
              combinedData.push({
                household: item.household,
                parking: `車位 ${item.parking}`
              });
            });
          }
        } catch(e) {
          console.warn("Failed to parse single state from localStorage");
        }
      }

      // Parse batch state
      if (batchSaved) {
        try {
          const parsed = JSON.parse(batchSaved);
          if (parsed && parsed.householdsOrder && parsed.assignedParking) {
            parsed.householdsOrder.forEach((household, index) => {
              const parking = parsed.assignedParking[index];
              if (parking !== null) {
                combinedData.push({
                  household: household,
                  parking: `車位 ${parking}`
                });
              }
            });
          }
        } catch(e) {
          console.warn("Failed to parse batch state from localStorage");
        }
      }

      if (combinedData.length > 0) {
        onDataLoaded(combinedData, "本機瀏覽器暫存");
      } else {
        playSound('warning');
        alert("本機瀏覽器中目前無任何已完成的車位抽籤資料！請使用 CSV 檔案匯入。");
      }
    }

    // Handle file uploads
    function handleFile(file) {
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const parsed = parseCSV(text);
        
        if (parsed.length > 0) {
          onDataLoaded(parsed, file.name);
        } else {
          playSound('warning');
          alert("CSV 格式解析失敗！請確認匯入的檔案是由系統產生的正確 CSV 檔案。");
        }
      };
      reader.readAsText(file, "UTF-8");
    }

    // Drag and drop bindings
    dropzone.addEventListener("click", () => csvFileInput.click());
    
    csvFileInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("border-indigo-500", "bg-indigo-950/10");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("border-indigo-500", "bg-indigo-950/10");
    });

    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("border-indigo-500", "bg-indigo-950/10");
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // Local load button
    loadLocalBtn.addEventListener("click", loadLocalData);

    // Search Logic
    function doSearch(query) {
      const cleanQuery = query.toLowerCase().trim();
      
      if (!cleanQuery) {
        exactMatchContainer.classList.add("hidden");
        listHeading.textContent = "所有配對清單";
        listHeading.classList.remove("hidden");
        renderResultsList(loadedData);
        return;
      }

      // Filter (matches household code, parking code, or translated address)
      const matches = loadedData.filter(item => {
        const addr = getHouseholdAddress(item.household);
        return item.household.toLowerCase().includes(cleanQuery) || 
               item.parking.toLowerCase().includes(cleanQuery) ||
               addr.toLowerCase().includes(cleanQuery);
      });

      // Check exact match
      const exactMatch = loadedData.find(item => 
        item.household.toLowerCase() === cleanQuery
      );

      if (exactMatch) {
        matchHousehold.textContent = exactMatch.household;
        matchAddress.textContent = getHouseholdAddress(exactMatch.household);
        matchParking.textContent = exactMatch.parking;
        exactMatchContainer.classList.remove("hidden");
      } else {
        exactMatchContainer.classList.add("hidden");
        matchAddress.textContent = "";
      }

      // Render remaining matches
      listHeading.textContent = `搜尋相符的結果 (共 ${matches.length} 筆)`;
      listHeading.classList.remove("hidden");
      renderResultsList(matches);
    }

    function renderResultsList(data) {
      searchResultsList.innerHTML = "";
      
      if (data.length === 0) {
        searchResultsList.innerHTML = `
          <div class="col-span-full text-center text-slate-500 py-8 text-sm">
            找不到相符的結果 🔍
          </div>
        `;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-slate-950/40 border border-slate-900 rounded-xl p-4 flex justify-between items-center hover:bg-slate-900/30 transition-all font-mono";
        const addr = getHouseholdAddress(item.household);
        card.innerHTML = `
          <div class="flex flex-col">
            <span class="text-indigo-300 font-bold text-base">${item.household}</span>
            ${addr ? `<span class="text-[10px] text-slate-500 leading-tight">${addr}</span>` : ''}
          </div>
          <span class="text-slate-650 text-xs">➜</span>
          <span class="text-emerald-450 font-bold">${item.parking}</span>
        `;
        searchResultsList.appendChild(card);
      });
    }

    // Input listener for search
    searchInput.addEventListener("input", (e) => {
      doSearch(e.target.value);
    });

    // Auto load local data if it exists on load
    window.addEventListener("load", () => {
      const singleSaved = localStorage.getItem('lottery_state_single');
      const batchSaved = localStorage.getItem('lottery_state_batch');
      if (singleSaved || batchSaved) {
        loadLocalData();
      }
    });
  </script>
</body>
</html>
